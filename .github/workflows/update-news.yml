name: Update news

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - "scripts/update-news.mjs"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fetch and filter news
        run: node scripts/update-news.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- js/news-data.js; then
            echo "No changes to news data."
          else
            git add js/news-data.js
            git commit -m "Update news data [automated]"
            git push
          fi
